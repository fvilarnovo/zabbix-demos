              expression: 'avg(/APM application by ClickHouse HTTP v3/apm.error_rate[{#SERVICE}],5m)>={$APM.ERROR.MAX:"{#SERVICE}"} and last(/APM application by ClickHouse HTTP v3/apm.requests[{#SERVICE}])>={$APM.MIN.REQUESTS:"{#SERVICE}"}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'avg(/APM application by ClickHouse HTTP v3/apm.error_rate[{#SERVICE}],5m)<{$APM.ERROR.MAX:"{#SERVICE}"}'
              name: 'APM {#SERVICE}: High error rate'
              event_name: 'APM {#SERVICE}: High error rate (>= {$APM.ERROR.MAX:"{#SERVICE}"}% for 5m)'
              opdata: 'Current: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'Error rate of entry spans. Opens only with at least {$APM.MIN.REQUESTS} requests; closes when the value recovers, not when traffic drops.'
              dependencies:
                - name: 'APM: No data from ClickHouse'
                  expression: 'nodata(/APM application by ClickHouse HTTP v3/apm.services.rows,5m)=1'
              tags:
                - tag: scope
                  value: availability
            - uuid: fbf53a9a20c2420984f4149b17ad817d
              expression: 'avg(/APM application by ClickHouse HTTP v3/apm.latency.p95[{#SERVICE}],5m)*1000>={$APM.P95.MAX:"{#SERVICE}"} and last(/APM application by ClickHouse HTTP v3/apm.requests[{#SERVICE}])>={$APM.MIN.REQUESTS:"{#SERVICE}"}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'avg(/APM application by ClickHouse HTTP v3/apm.latency.p95[{#SERVICE}],5m)*1000<{$APM.P95.MAX:"{#SERVICE}"}'
              name: 'APM {#SERVICE}: High p95 latency'
              event_name: 'APM {#SERVICE}: High p95 latency (>= {$APM.P95.MAX:"{#SERVICE}"}ms for 5m)'
              opdata: 'Current: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'p95 of entry spans. Opens only with at least {$APM.MIN.REQUESTS} requests; closes when the value recovers, not when traffic drops.'
              dependencies:
                - name: 'APM: No data from ClickHouse'
                  expression: 'nodata(/APM application by ClickHouse HTTP v3/apm.services.rows,5m)=1'
              tags:
                - tag: scope
                  value: performance
            - uuid: 6af1064807b646bc831893db4f6c6dc4
              expression: 'avg(/APM application by ClickHouse HTTP v3/apm.apdex[{#SERVICE}],5m)<{$APM.APDEX.MIN:"{#SERVICE}"} and last(/APM application by ClickHouse HTTP v3/apm.requests[{#SERVICE}])>={$APM.MIN.REQUESTS:"{#SERVICE}"}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'avg(/APM application by ClickHouse HTTP v3/apm.apdex[{#SERVICE}],5m)>={$APM.APDEX.MIN:"{#SERVICE}"}'
              name: 'APM {#SERVICE}: Low Apdex'
              event_name: 'APM {#SERVICE}: Low Apdex (< {$APM.APDEX.MIN:"{#SERVICE}"} for 5m)'
              opdata: 'Current: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'APM: No data from ClickHouse'
                  expression: 'nodata(/APM application by ClickHouse HTTP v3/apm.services.rows,5m)=1'
              tags:
                - tag: scope
                  value: performance
          graph_prototypes:
            - uuid: 8417888978a64d9080c0e56d1cbf9a50
              name: 'APM {#SERVICE}: Apdex'
              type: STACKED
              graph_items:
                - drawtype: FILLED_REGION
                  color: 199C0D
                  item:
                    host: 'APM application by ClickHouse HTTP v3'
                    key: 'apm.apdex.satisfied[{#SERVICE}]'
                - sortorder: '1'
                  drawtype: FILLED_REGION
                  color: F7941D
                  item:
                    host: 'APM application by ClickHouse HTTP v3'
                    key: 'apm.apdex.tolerated[{#SERVICE}]'
                - sortorder: '2'
                  drawtype: FILLED_REGION
                  color: F63100
                  item:
                    host: 'APM application by ClickHouse HTTP v3'
                    key: 'apm.apdex.frustrated[{#SERVICE}]'
            - uuid: 302f3dee4e6b496d830589bf4a3cc33c
              name: 'APM {#SERVICE}: Latency'
              graph_items:
                - color: 199C0D
                  item:
                    host: 'APM application by ClickHouse HTTP v3'
                    key: 'apm.latency.p50[{#SERVICE}]'
                - sortorder: '1'
                  color: F7941D
                  item:
                    host: 'APM application by ClickHouse HTTP v3'
                    key: 'apm.latency.p95[{#SERVICE}]'
                - sortorder: '2'
                  color: F63100
                  item:
                    host: 'APM application by ClickHouse HTTP v3'
                    key: 'apm.latency.p99[{#SERVICE}]'
            - uuid: b76f90754eb3437c847fa3a48d7c1d69
              name: 'APM {#SERVICE}: Requests vs errors'
              graph_items:
                - color: 2774A4
                  item:
                    host: 'APM application by ClickHouse HTTP v3'
                    key: 'apm.requests[{#SERVICE}]'
                - sortorder: '1'
                  drawtype: BOLD_LINE
                  color: F63100
                  item:
                    host: 'APM application by ClickHouse HTTP v3'
                    key: 'apm.errors[{#SERVICE}]'
          master_item:
            key: apm.services.get
          lld_macro_paths:
            - lld_macro: '{#SERVICE}'
              path: $.service
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return JSON.stringify(JSON.parse(value).data.filter(function (r) { return r.type === ''service''; }).map(function (r) { return {service: r.service}; }));'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
      tags:
        - tag: class
          value: application
        - tag: target
          value: apm
      macros:
        - macro: '{$APM.APDEX.MIN}'
          value: '0.7'
          description: 'Low Apdex threshold. Supports service context.'
        - macro: '{$APM.APDEX.T}'
          value: '500'
          description: 'Apdex T, ms. Set by the discovery host.'
        - macro: '{$APM.CONN.LIMIT}'
          value: '100'
          description: 'Outgoing edges of the application (busiest first).'
        - macro: '{$APM.DISCOVERY.WINDOW}'
          value: '60'
          description: 'Minutes: services active in this window are discovered. Set by the discovery host.'
        - macro: '{$APM.ENDPOINT.ERROR.MAX}'
          value: '5'
          description: 'Error rate % of one endpoint. Supports service context.'
        - macro: '{$APM.ENDPOINT.LIMIT}'
          value: '20'
          description: 'Endpoints per service (busiest first).'
        - macro: '{$APM.ENDPOINT.MATCHES}'
          value: '.*'
          description: 'Regex: endpoints to discover.'
        - macro: '{$APM.ENDPOINT.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Regex: endpoints to ignore.'
        - macro: '{$APM.ENV}'
          description: 'deployment.environment.name of this host; set by the discovery host. Empty = spans without environment.'
        - macro: '{$APM.ERROR.MAX}'
          value: '5'
          description: 'Error rate %, problem. Supports service context.'
        - macro: '{$APM.ERROR.WARN}'
          value: '1'
          description: 'Error rate %, warning. Supports service context.'
        - macro: '{$APM.JOB.ERROR.MAX}'
          value: '5'
          description: 'Error rate % of a job. Supports service context.'
        - macro: '{$APM.JOB.P95.MAX}'
          value: '60000'
          description: 'p95 ms of a job. Supports service context.'
        - macro: '{$APM.MIN.REQUESTS}'
          value: '10'
          description: 'Requests in the window needed to OPEN error, p95 and Apdex problems. Supports service context.'
        - macro: '{$APM.NAMESPACE}'
          description: 'service.namespace of this host; set by the discovery host. Empty = spans without namespace.'
        - macro: '{$APM.NOTRAFFIC.ALERT}'
          value: '1'
          description: 'Set to 0 to disable the No traffic trigger. Supports service context.'
        - macro: '{$APM.P95.MAX}'
          value: '3000'
          description: 'p95 ms, problem. Supports service context.'
        - macro: '{$APM.P95.WARN}'
          value: '1000'
          description: 'p95 ms, warning. Supports service context.'
        - macro: '{$APM.SERVICE.MATCHES}'
          value: '.*'
          description: 'Regex: services to discover.'
        - macro: '{$APM.SERVICE.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Regex: services to ignore.'
        - macro: '{$APM.WINDOW}'
          value: '5'
          description: 'Minutes aggregated by the metrics. Set by the discovery host.'
        - macro: '{$CH.DB}'
          value: zabbix
          description: 'Set by the discovery host.'
        - macro: '{$CH.PASSWORD}'
          type: SECRET_TEXT
          description: 'ClickHouse password. Set it HERE, in this template: discovered hosts inherit it and it never travels through LLD.'
        - macro: '{$CH.TABLE}'
          value: otel_traces
          description: 'Set by the discovery host.'
        - macro: '{$CH.URL}'
          value: 'http://localhost:8123/'
          description: 'Set by the discovery host.'
        - macro: '{$CH.USER}'
          value: zabbix_ro
          description: 'Set by the discovery host.'
      valuemaps:
        - uuid: 2d3cb03e20d547218490f63f2180ed1b
          name: 'APM health'
          mappings:
            - value: '0'
              newvalue: Healthy
            - value: '1'
              newvalue: Warning
            - value: '2'
              newvalue: Problem
    - uuid: 234fbe931ddd4d688061b0bb8dc3b075
      template: 'APM applications discovery by ClickHouse HTTP v3'
      name: 'APM applications discovery by ClickHouse HTTP v3'
      description: |
        Version 3. Link it to ONE host. It discovers each service.namespace and deployment.environment.name in ClickHouse and creates a host apm-<namespace>-<environment> with "APM application by ClickHouse HTTP v3" and its macros.
        Author: fvilarnovo. License: MIT.
      groups:
        - name: Templates/Applications
      items:
        - uuid: 07326e1481bd465188621f386cd5721e
          name: 'APM: Get applications'
          type: HTTP_AGENT
          key: apm.applications.get
          delay: 5m
          history: '0'
          value_type: TEXT
          description: 'One row per application and environment.'
          timeout: 20s
          url: '{$CH.URL}'
          query_fields:
            - name: param_db
              value: '{$CH.DB}'
            - name: param_tbl
              value: '{$CH.TABLE}'
            - name: param_dwindow
              value: '{$APM.DISCOVERY.WINDOW}'
          posts: |
            SELECT
                namespace,
                environment,
                uniqExact(ServiceName) AS services,
                count() AS spans
            FROM
            (
                SELECT ResourceAttributes['service.namespace'] AS namespace, if(ResourceAttributes['deployment.environment.name']  != '', ResourceAttributes['deployment.environment.name'], ResourceAttributes['deployment.environment']) AS environment, ServiceName
                FROM {db:Identifier}.{tbl:Identifier}
                WHERE Timestamp  > now() - toIntervalMinute({dwindow:UInt32})
                  AND ServiceName != ''
            )
            GROUP BY namespace, environment
            ORDER BY namespace, environment
            FORMAT JSON
            SETTINGS output_format_json_quote_64bit_integers  = 0, max_execution_time = 15
          headers:
            - name: X-ClickHouse-User
              value: '{$CH.USER}'
            - name: X-ClickHouse-Key
              value: '{$CH.PASSWORD}'
          request_method: POST
          tags:
            - tag: component
              value: apm
            - tag: component
              value: raw
        - uuid: 3f399f39832047bd85348b85e8c6291a
          name: 'APM: Applications found'
          type: DEPENDENT
          key: apm.applications.rows
          description: 'Application and environment pairs with recent spans.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.rows
          master_item:
            key: apm.applications.get
          tags:
            - tag: component
              value: apm
          triggers:
            - uuid: 617c5099cdee4f668a83a61b72441ff9
              expression: 'nodata(/APM applications discovery by ClickHouse HTTP v3/apm.applications.rows,20m)=1'
              name: 'APM: Discovery cannot read ClickHouse'
              priority: AVERAGE
              description: 'New applications are not being discovered: check {$CH.URL}, {$CH.USER} and {$CH.PASSWORD} of this host.'
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: 217a1b33ee7d4dfc81f9c49b06c36a36
          name: 'APM applications discovery'
          type: DEPENDENT
          key: apm.applications.discovery
          filter:
            evaltype: AND
            conditions:
              - macro: '{#ENV}'
                value: '{$APM.ENV.MATCHES}'
              - macro: '{#ENV}'
                value: '{$APM.ENV.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#NAMESPACE}'
                value: '{$APM.NAMESPACE.MATCHES}'
              - macro: '{#NAMESPACE}'
                value: '{$APM.NAMESPACE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          lifetime: 30d
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 1d
          description: 'One host per service.namespace and deployment.environment.name with spans in the last {$APM.DISCOVERY.WINDOW} minutes. A host that stops reporting is disabled after 1 day and deleted, with its history, after 30 days.'
          host_prototypes:
            - uuid: 43ce4f13bbfc49e08b509d820b5c80da
              host: '{#HOST}'
              name: 'APM {#NS_LABEL} ({#ENV_LABEL})'
              group_links:
                - group:
                    name: Applications
              group_prototypes:
                - name: 'Applications/APM/{#NS_LABEL}'
              templates:
                - name: 'APM application by ClickHouse HTTP v3'
              macros:
                - macro: '{$APM.APDEX.T}'
                  value: '{#APDEX_T}'
                  description: 'From the discovery host.'
                - macro: '{$APM.DISCOVERY.WINDOW}'
                  value: '{#DWINDOW}'
                  description: 'From the discovery host.'
                - macro: '{$APM.ENV}'
                  value: '{#ENV}'
                  description: 'From the discovery host.'
                - macro: '{$APM.NAMESPACE}'
                  value: '{#NAMESPACE}'
                  description: 'From the discovery host.'
                - macro: '{$APM.WINDOW}'
                  value: '{#WINDOW}'
                  description: 'From the discovery host.'
                - macro: '{$CH.DB}'
                  value: '{#CH_DB}'
                  description: 'From the discovery host.'
                - macro: '{$CH.TABLE}'
                  value: '{#CH_TABLE}'
                  description: 'From the discovery host.'
                - macro: '{$CH.URL}'
                  value: '{#CH_URL}'
                  description: 'From the discovery host.'
                - macro: '{$CH.USER}'
                  value: '{#CH_USER}'
                  description: 'From the discovery host.'
              tags:
                - tag: component
                  value: apm
                - tag: environment
                  value: '{#ENV_LABEL}'
                - tag: namespace
                  value: '{#NS_LABEL}'
          master_item:
            key: apm.applications.get
          lld_macro_paths:
            - lld_macro: '{#APDEX_T}'
              path: $.apdex_t
            - lld_macro: '{#CH_DB}'
              path: $.db
            - lld_macro: '{#CH_TABLE}'
              path: $.table
            - lld_macro: '{#CH_URL}'
              path: $.url
            - lld_macro: '{#CH_USER}'
              path: $.user
            - lld_macro: '{#DWINDOW}'
              path: $.dwindow
            - lld_macro: '{#ENV_LABEL}'
              path: $.env_label
            - lld_macro: '{#ENV}'
              path: $.environment
            - lld_macro: '{#HOST}'
              path: $.host
            - lld_macro: '{#NAMESPACE}'
              path: $.namespace
            - lld_macro: '{#NS_LABEL}'
              path: $.ns_label
            - lld_macro: '{#WINDOW}'
              path: $.window
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  function label(s, empty) {
                      return s === '' ? empty : s.replace(/[^0-9A-Za-z._-]/g, '-');
                  }
                  return JSON.stringify(JSON.parse(value).data.map(function (r) {
                      var ns = label(r.namespace,  'no-namespace'), env = label(r.environment, 'no-env');
                      return {
                          namespace: r.namespace, environment: r.environment, ns_label: ns, env_label: env,
                          host: 'apm-' + ns + '-'  + env,
                          url: '{$CH.URL}', db: '{$CH.DB}', table: '{$CH.TABLE}', user: '{$CH.USER}',
                          window: '{$APM.WINDOW}', dwindow: '{$APM.DISCOVERY.WINDOW}', apdex_t: '{$APM.APDEX.T}'
                       };
                  }));
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
      tags:
        - tag: class
          value: application
        - tag: target
          value: apm
      macros:
        - macro: '{$APM.APDEX.T}'
          value: '500'
          description: 'Apdex T, ms; passed to the discovered hosts.'
        - macro: '{$APM.DISCOVERY.WINDOW}'
          value: '60'
          description: 'Minutes of activity to discover applications and services; passed to the discovered hosts.'
        - macro: '{$APM.ENV.MATCHES}'
          value: '.*'
          description: 'Regex: environments to discover.'
        - macro: '{$APM.ENV.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Regex: environments to ignore.'
        - macro: '{$APM.NAMESPACE.MATCHES}'
          value: '.*'
          description: 'Regex: namespaces to discover.'
        - macro: '{$APM.NAMESPACE.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Regex: namespaces to ignore.'
        - macro: '{$APM.WINDOW}'
          value: '5'
          description: 'Minutes aggregated by the metrics; passed to the discovered hosts.'
        - macro: '{$CH.DB}'
          value: zabbix
          description: 'Database; passed to the discovered hosts.'
        - macro: '{$CH.PASSWORD}'
          type: SECRET_TEXT
          description: 'Password for discovery only. Discovered hosts read it from "APM application by ClickHouse HTTP v3".'
        - macro: '{$CH.TABLE}'
          value: otel_traces
          description: 'Spans table; passed to the discovered hosts.'
        - macro: '{$CH.URL}'
          value: 'http://localhost:8123/'
          description: 'ClickHouse HTTP interface; passed to the discovered hosts.'
        - macro: '{$CH.USER}'
          value: zabbix_ro
          description: 'Read-only user with readonly=2 (the queries set max_execution_time); passed to the discovered hosts.'
    - uuid: 16049a5ecda146f7a7075b5927fd279d
      template: 'Tormenta APM by Telemetry query'
      name: 'Tormenta APM by Telemetry query'
      description: 'Latencia y errores de los pedidos de imágenes, con ítems Telemetry query de Zabbix 8.0.'
      groups:
        - name: Templates/Tormenta
      items:
        - uuid: e589a0473f5a40f285745052b1e45a99
          name: 'APM estación: p95 del pedido de imagen'
          type: TELEMETRY_QUERY
          key: tor.apm.imagen.p95
          delay: 30s
          value_type: FLOAT
          units: s
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[0].p95'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: MULTIPLIER
              parameters:
                - '1.0E-9'
          timeout: 5s
          time_shift: 15s
          lookback_limit: 1m
          granularity: 1m
          query:
            columns:
              - column: ServiceName
            aggregated_columns:
              - function: PERCENTILE
                column: Duration
                parameters:
                  - '95'
                alias: p95
            filter:
              conditions:
                - column: ResourceAttributes
                  attribute_key: service.namespace
                  value: '{$TOR.NS}'
                - column: ServiceName
                  value: estacion
                - column: SpanKind
                  value: Server
                - column: SpanName
                  value: 'POST /imagen'
          tags:
            - tag: component
              value: apm
        - uuid: 5ee4ef6afcbf477e9c3c5ed5cc5db6db
