          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[0].errores'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          timeout: 5s
          time_shift: 15s
          lookback_limit: 1m
          granularity: 1m
          query:
            columns:
              - column: ServiceName
            aggregated_columns:
              - alias: errores
            filter:
              conditions:
                - column: ResourceAttributes
                  attribute_key: service.namespace
                  value: '{$TOR.NS}'
                - column: ServiceName
                  value: planificador
                - column: SpanKind
                  value: Server
                - column: SpanName
                  value: 'POST /planificar'
                - column: StatusCode
                  value: Error
          tags:
            - tag: component
              value: apm
        - uuid: 11b31b01b6f941b39dabc5fc87befe56
          name: 'APM planificador: tasa de errores'
