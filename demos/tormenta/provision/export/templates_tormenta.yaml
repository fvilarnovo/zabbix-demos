                - tag: exposicion
                  value: clima-espacial
                - tag: recurso
                  value: apm-planificador
        - uuid: 93c831d875234d1484948c768e86ec90
          name: 'APM planificador: pedidos por minuto'
          type: TELEMETRY_QUERY
          key: tor.apm.planificador.total
          delay: 30s
          value_type: FLOAT
          preprocessing:
