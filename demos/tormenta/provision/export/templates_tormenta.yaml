    - uuid: 02f5fcd0eba34b25b6c70d54d80b977b
      template: 'Tormenta KPIs by ClickHouse'
      name: 'Tormenta KPIs by ClickHouse'
      description: 'Imágenes entregadas y fallidas, calculadas desde las trazas en ClickHouse.'
      groups:
        - name: Templates/Tormenta
      items:
        - uuid: 92d72e5dbdd2419192b228ecf228e427
          name: 'Tormenta: consulta de KPI a ClickHouse'
          type: HTTP_AGENT
          key: tor.kpi.get
          delay: 30s
          history: 1h
          value_type: TEXT
          timeout: 15s
          url: '{$CH.URL}'
          posts: |
            
            WITH
                toDate(Timestamp, 'America/Mexico_City') = toDate(now(), 'America/Mexico_City') AS hoy,
                Timestamp > now() - toIntervalMinute(15) AS ult_15m,
                ServiceName = 'estacion' AND SpanName = 'POST /imagen' AS es_pedido,
                StatusCode = 'Error' AS fallo,
                toFloat64OrZero(SpanAttributes['tormenta.megabytes']) AS megas
             SELECT
                countIf(hoy AND es_pedido AND NOT fallo) AS imagenes_hoy,
                countIf(ult_15m AND es_pedido AND fallo) AS imagenes_fallidas_15m,
                countIf(ult_15m AND es_pedido AND NOT fallo) AS imagenes_15m,
                round(sumIf(megas, hoy AND es_pedido AND NOT fallo) / 1024, 2) AS gigas_hoy
            FROM zabbix.otel_traces
            WHERE Timestamp > now() - toIntervalHour(24)
              AND ResourceAttributes['service.namespace'] = '{$TOR.NS}'
              AND SpanKind = 'Server'
             FORMAT JSONEachRow
          headers:
            - name: X-ClickHouse-User
              value: '{$CH.USER}'
            - name: X-ClickHouse-Key
              value: '{$CH.PASSWORD}'
          request_method: POST
        - uuid: ebe98f555a56498f991fae6ba77d0777
          name: 'Negocio: datos entregados hoy'
          type: DEPENDENT
          key: 'tor.kpi[gigas_hoy]'
          value_type: FLOAT
          units: GB
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.gigas_hoy
          master_item:
            key: tor.kpi.get
          tags:
            - tag: component
              value: negocio
        - uuid: 1009eb70aa774dfdac526e1c1db4874f
          name: 'Negocio: imágenes entregadas en 15 min'
          type: DEPENDENT
          key: 'tor.kpi[imagenes_15m]'
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.imagenes_15m
          master_item:
            key: tor.kpi.get
          tags:
            - tag: component
              value: negocio
        - uuid: 84112ea57b464997aa067e0ce6edbb83
          name: 'Negocio: pedidos de imágenes fallidos en 15 min'
          type: DEPENDENT
          key: 'tor.kpi[imagenes_fallidas_15m]'
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.imagenes_fallidas_15m
          master_item:
            key: tor.kpi.get
          tags:
            - tag: component
              value: negocio
        - uuid: 5bfc468f76ad41febecb109c88e1d993
          name: 'Negocio: imágenes entregadas hoy'
          type: DEPENDENT
          key: 'tor.kpi[imagenes_hoy]'
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.imagenes_hoy
          master_item:
            key: tor.kpi.get
          tags:
            - tag: component
              value: negocio
      tags:
        - tag: demo
          value: tormenta
      macros:
        - macro: '{$CH.PASSWORD}'
        - macro: '{$CH.URL}'
          value: 'http://clickhouse:8123/'
        - macro: '{$CH.USER}'
          value: zabbix
        - macro: '{$TOR.NS}'
          value: tormenta
