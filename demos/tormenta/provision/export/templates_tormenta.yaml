zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: 8cf958f80c814d118fa9c1cc47248ebb
      name: Templates/Applications
    - uuid: 33b3ac9b705e43b3a2c0327a6dc59266
      name: Templates/Tormenta
  host_groups:
    - uuid: b7f8225e7c0548c582f19f53b0e5f40c
      name: Applications
  templates:
    - uuid: 76bb1716f272424d8b0c6c2a07a5b565
      template: 'APM application by ClickHouse HTTP v3'
      name: 'APM application by ClickHouse HTTP v3'
      description: |
        Version 3. Monitors one application and environment (one service.namespace and deployment.environment.name): services, jobs, endpoints and outgoing connections.
        
        Do not link it by hand: "APM applications discovery by ClickHouse HTTP v3" creates one host per application and environment and sets its macros.
        A request is an entry span (SpanKind Server or Consumer). Root spans of other kinds are jobs, not user traffic.
        Set {$CH.PASSWORD} in this template if the ClickHouse user has a password.
        Author: fvilarnovo. License: MIT.
      groups:
        - name: Templates/Applications
      items:
        - uuid: 0d972a47e39642478dd97d48984dac13
          name: 'APM: Get connections'
          type: HTTP_AGENT
          key: apm.connections.get
          history: '0'
          value_type: TEXT
          description: 'One row per outgoing edge.'
          timeout: 20s
          url: '{$CH.URL}'
          query_fields:
            - name: param_db
              value: '{$CH.DB}'
            - name: param_tbl
              value: '{$CH.TABLE}'
            - name: param_window
              value: '{$APM.WINDOW}'
            - name: param_limit
              value: '{$APM.CONN.LIMIT}'
            - name: param_ns
              value: '{$APM.NAMESPACE}'
            - name: param_env
              value: '{$APM.ENV}'
          posts: |
            SELECT
                src, dst, dst_ns, type,
                count() AS calls,
                round(calls / {window:UInt32}, 3) AS cpm,
                round(countIf(is_error) / calls * 100, 3) AS error_rate,
                round(quantile(0.95)(dur)  / 1e6, 3) AS p95_ms
            FROM
            (
                -- Usuarios -> servicio: solo spans de entrada raíz (un cron no es un usuario).
                SELECT 'users' AS src, ServiceName AS dst, {ns:String} AS dst_ns, 'user'  AS type, Duration AS dur, StatusCode = 'Error' AS is_error
                FROM {db:Identifier}.{tbl:Identifier}
                WHERE Timestamp > now() - toIntervalMinute({window:UInt32})
                  AND ServiceName !=  ''
                  AND ParentSpanId = '' AND SpanKind IN ('Server', 'Consumer')
                  AND ResourceAttributes['service.namespace'] = {ns:String} AND if(ResourceAttributes['deployment.environment.name']  != '', ResourceAttributes['deployment.environment.name'], ResourceAttributes['deployment.environment']) = {env:String}
            
                UNION ALL
            
                -- Servicio -> base de datos o cola.
                SELECT  ServiceName, multiIf(SpanAttributes['db.system.name'] != '', SpanAttributes['db.system.name'], SpanAttributes['db.system'] != '', SpanAttributes['db.system'], SpanAttributes['messaging.system']),  '', 'database', Duration, StatusCode = 'Error'
                FROM {db:Identifier}.{tbl:Identifier}
                WHERE Timestamp > now() - toIntervalMinute({window:UInt32})
                  AND ServiceName != ''
                  AND  multiIf(SpanAttributes['db.system.name'] != '', SpanAttributes['db.system.name'], SpanAttributes['db.system'] != '', SpanAttributes['db.system'], SpanAttributes['messaging.system']) != ''
                   AND ResourceAttributes['service.namespace'] = {ns:String} AND if(ResourceAttributes['deployment.environment.name'] != '', ResourceAttributes['deployment.environment.name'], ResourceAttributes['deployment.environment'])  = {env:String}
            
                UNION ALL
            
                -- Servicio -> servicio, aunque esté en otro namespace, o -> externo. Medido del lado de quien llama.
                SELECT p.ServiceName,
                       if(c.ServiceName  != '', c.ServiceName, p.peer),
                       if(c.ServiceName != '', c.namespace, ''),
                       if(c.ServiceName != '', 'service', 'external'),
                       p.Duration, p.StatusCode = 'Error'
                 FROM
                (
                    SELECT TraceId, SpanId, ServiceName, Duration, StatusCode,
                           multiIf(SpanAttributes['peer.service'] != '', SpanAttributes['peer.service'],
                                    SpanAttributes['server.address'] != '', SpanAttributes['server.address'],
                                   SpanAttributes['net.peer.name'] != '', SpanAttributes['net.peer.name'],
                                    SpanAttributes['http.host']) AS peer
                    FROM {db:Identifier}.{tbl:Identifier}
                    WHERE Timestamp > now() - toIntervalMinute({window:UInt32})
                      AND ServiceName !=  ''
                      AND SpanKind IN ('Client', 'Producer') AND multiIf(SpanAttributes['db.system.name'] != '', SpanAttributes['db.system.name'], SpanAttributes['db.system'] != '', SpanAttributes['db.system'],  SpanAttributes['messaging.system']) = ''
                      AND ResourceAttributes['service.namespace'] = {ns:String} AND if(ResourceAttributes['deployment.environment.name'] != '', ResourceAttributes['deployment.environment.name'],  ResourceAttributes['deployment.environment']) = {env:String}
                ) AS p
                LEFT JOIN
                (
                    SELECT TraceId, ParentSpanId, any(ServiceName) AS ServiceName, any(ResourceAttributes['service.namespace'])  AS namespace
                    FROM {db:Identifier}.{tbl:Identifier}
                    WHERE Timestamp > now() - toIntervalMinute({window:UInt32} + 1)
                      AND SpanKind IN ('Server', 'Consumer') AND ParentSpanId  != ''
                    GROUP BY TraceId, ParentSpanId
                ) AS c ON c.TraceId = p.TraceId AND c.ParentSpanId = p.SpanId
                WHERE (c.ServiceName != '' AND (c.ServiceName != p.ServiceName OR c.namespace  != {ns:String}))
                   OR (c.ServiceName = '' AND p.peer != '')
            )
            GROUP BY src, dst, dst_ns, type
            ORDER BY calls DESC
            LIMIT {limit:UInt32}
            FORMAT JSON
            SETTINGS output_format_json_quote_64bit_integers  = 0, max_execution_time = 15, max_threads = 2
          headers:
            - name: X-ClickHouse-User
              value: '{$CH.USER}'
            - name: X-ClickHouse-Key
              value: '{$CH.PASSWORD}'
          request_method: POST
          tags:
            - tag: component
              value: apm
            - tag: component
              value: raw
        - uuid: ef32af4769af44db80f3b9de1bc4cffa
          name: 'APM: Get endpoints'
          type: HTTP_AGENT
          key: apm.endpoints.get
          history: '0'
          value_type: TEXT
          description: 'One row per endpoint, with the time breakdown.'
          timeout: 20s
          url: '{$CH.URL}'
          query_fields:
            - name: param_db
              value: '{$CH.DB}'
            - name: param_tbl
              value: '{$CH.TABLE}'
            - name: param_window
              value: '{$APM.WINDOW}'
            - name: param_dwindow
              value: '{$APM.DISCOVERY.WINDOW}'
            - name: param_apdex_t
              value: '{$APM.APDEX.T}'
            - name: param_limit
              value: '{$APM.ENDPOINT.LIMIT}'
            - name: param_ns
              value: '{$APM.NAMESPACE}'
            - name: param_env
              value: '{$APM.ENV}'
          posts: |
            WITH
                Timestamp > now() - toIntervalMinute({window:UInt32}) AS recent,
                toUInt64({apdex_t:UInt32}) * 1000000 AS t_ns
            SELECT
                e.ServiceName AS service,
                e.SpanName AS endpoint,
                 count() AS hits,
                countIf(recent) AS requests,
                countIf(recent AND e.StatusCode = 'Error') AS errors,
                if(requests = 0, 0, round(errors / requests * 100, 3)) AS error_rate,
                 round(requests / {window:UInt32}, 3) AS rpm,
                if(requests = 0, -1, round(avgIf(e.Duration, recent) / 1e6, 3)) AS avg_ms,
                if(requests = 0, -1, round(quantileIf(0.95)(e.Duration, recent)  / 1e6, 3)) AS p95_ms,
                countIf(recent AND e.StatusCode != 'Error' AND e.Duration <= t_ns) AS apdex_satisfied,
                countIf(recent AND e.StatusCode != 'Error' AND e.Duration > t_ns AND e.Duration  <= 4 * t_ns) AS apdex_tolerated,
                if(requests = 0, -1, round((apdex_satisfied + apdex_tolerated / 2) / requests, 3)) AS apdex,
                sumIf(e.Duration, recent) AS total_ns,
                sumIf(least(k.db_ns,  e.Duration), recent) AS db_ns,
                sumIf(least(k.ext_ns, e.Duration - least(k.db_ns, e.Duration)), recent) AS ext_ns,
                if(total_ns = 0, -1, round(db_ns / total_ns * 100, 1)) AS time_db_pct,
                 if(total_ns = 0, -1, round(ext_ns / total_ns * 100, 1)) AS time_ext_pct,
                if(total_ns = 0, -1, round(100 - time_db_pct - time_ext_pct, 1)) AS time_self_pct
            FROM
            (
                SELECT Timestamp,  TraceId, SpanId, ServiceName, SpanName, Duration, StatusCode
                FROM {db:Identifier}.{tbl:Identifier}
                WHERE Timestamp > now() - toIntervalMinute({dwindow:UInt32})
                  AND ServiceName  != ''
                  AND SpanKind IN ('Server', 'Consumer')
                  AND ResourceAttributes['service.namespace'] = {ns:String}
                  AND if(ResourceAttributes['deployment.environment.name'] != '', ResourceAttributes['deployment.environment.name'],  ResourceAttributes['deployment.environment']) = {env:String}
            ) AS e
            LEFT JOIN
            (
                -- Hijos directos del span de entrada: bases de datos y colas por un lado, otras llamadas salientes por  otro.
                SELECT TraceId, ParentSpanId,
                    sumIf(Duration, multiIf(SpanAttributes['db.system.name'] != '', SpanAttributes['db.system.name'], SpanAttributes['db.system'] != '', SpanAttributes['db.system'],  SpanAttributes['messaging.system']) != '') AS db_ns,
                    sumIf(Duration, multiIf(SpanAttributes['db.system.name'] != '', SpanAttributes['db.system.name'], SpanAttributes['db.system'] != '',  SpanAttributes['db.system'], SpanAttributes['messaging.system']) = '' AND SpanKind IN ('Client', 'Producer')) AS ext_ns
                FROM {db:Identifier}.{tbl:Identifier}
                WHERE Timestamp > now()  - toIntervalMinute({window:UInt32} + 1)
                  AND ParentSpanId != ''
                  AND ResourceAttributes['service.namespace'] = {ns:String}
                  AND if(ResourceAttributes['deployment.environment.name']  != '', ResourceAttributes['deployment.environment.name'], ResourceAttributes['deployment.environment']) = {env:String}
                GROUP BY TraceId, ParentSpanId
            ) AS k ON k.TraceId = e.TraceId AND  k.ParentSpanId = e.SpanId
            GROUP BY service, endpoint
            ORDER BY hits DESC, service, endpoint
            LIMIT {limit:UInt32} BY service
            FORMAT JSON
            SETTINGS output_format_json_quote_64bit_integers = 0,  max_execution_time = 15, max_threads = 2
          headers:
            - name: X-ClickHouse-User
              value: '{$CH.USER}'
            - name: X-ClickHouse-Key
              value: '{$CH.PASSWORD}'
          request_method: POST
          tags:
            - tag: component
              value: apm
            - tag: component
              value: raw
        - uuid: a2abb3d6b72b4d4d89f32f9be828436b
          name: 'APM: Get services and jobs'
          type: HTTP_AGENT
          key: apm.services.get
          history: '0'
          value_type: TEXT
          description: 'One row per service (entry spans) and per job (other root spans) of this application and environment.'
          timeout: 20s
          url: '{$CH.URL}'
          query_fields:
            - name: param_db
              value: '{$CH.DB}'
            - name: param_tbl
              value: '{$CH.TABLE}'
            - name: param_window
              value: '{$APM.WINDOW}'
            - name: param_dwindow
              value: '{$APM.DISCOVERY.WINDOW}'
            - name: param_apdex_t
              value: '{$APM.APDEX.T}'
            - name: param_ns
              value: '{$APM.NAMESPACE}'
            - name: param_env
              value: '{$APM.ENV}'
          posts: |
            WITH
                Timestamp > now() - toIntervalMinute({window:UInt32}) AS recent,
                toUInt64({apdex_t:UInt32}) * 1000000 AS t_ns
            SELECT
                service,
                type,
                countIf(recent) AS requests,
                 countIf(recent AND StatusCode = 'Error') AS errors,
                if(requests = 0, 0, round(errors / requests * 100, 3)) AS error_rate,
                round(requests / {window:UInt32}, 3) AS rpm,
                if(requests  = 0, -1, round((quantilesIf(0.50, 0.95, 0.99)(Duration, recent) AS q)[1] / 1e6, 3)) AS p50_ms,
                if(requests = 0, -1, round(q[2] / 1e6, 3)) AS p95_ms,
                if(requests = 0, -1, round(q[3] /  1e6, 3)) AS p99_ms,
                countIf(recent AND StatusCode != 'Error' AND Duration <= t_ns) AS apdex_satisfied,
                countIf(recent AND StatusCode != 'Error' AND Duration > t_ns AND Duration <= 4  * t_ns) AS apdex_tolerated,
                requests - apdex_satisfied - apdex_tolerated AS apdex_frustrated,
                if(requests = 0, -1, round((apdex_satisfied + apdex_tolerated / 2) / requests, 3)) AS apdex
             FROM
            (
                -- Petición: span de entrada (Server/Consumer). Tarea: span raíz que no es de entrada ni de navegador.
                SELECT
                    ServiceName AS service,
                    if(SpanKind IN ('Server',  'Consumer'), 'service', 'job') AS type,
                    Timestamp, Duration, StatusCode
                FROM {db:Identifier}.{tbl:Identifier}
                WHERE Timestamp > now() - toIntervalMinute({dwindow:UInt32})
                   AND ServiceName != ''
                  AND ResourceAttributes['service.namespace'] = {ns:String}
                  AND if(ResourceAttributes['deployment.environment.name'] != '', ResourceAttributes['deployment.environment.name'],  ResourceAttributes['deployment.environment']) = {env:String}
                  AND (SpanKind IN ('Server', 'Consumer')
                       OR (ParentSpanId = '' AND ResourceAttributes['telemetry.sdk.language'] !=  'webjs'))
            )
            GROUP BY service, type
            ORDER BY service, type
            FORMAT JSON
            SETTINGS output_format_json_quote_64bit_integers = 0, max_execution_time = 15
          headers:
            - name: X-ClickHouse-User
              value: '{$CH.USER}'
            - name: X-ClickHouse-Key
              value: '{$CH.PASSWORD}'
          request_method: POST
          tags:
            - tag: component
              value: apm
            - tag: component
              value: raw
        - uuid: 6cb1d0aca8c0460082dbbb8c097a280f
          name: 'APM: Services and jobs found'
          type: DEPENDENT
          key: apm.services.rows
          description: 'Rows returned by ClickHouse; used to detect connectivity problems.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.rows
          master_item:
            key: apm.services.get
          tags:
            - tag: component
              value: apm
          triggers:
            - uuid: e8c3c3d378bd487b88e444cbf5e78804
              expression: 'nodata(/APM application by ClickHouse HTTP v3/apm.services.rows,5m)=1'
              name: 'APM: No data from ClickHouse'
              event_name: 'APM: No data from ClickHouse for 5m'
              priority: AVERAGE
              description: 'The master item returned nothing for 5 minutes: check {$CH.URL}, {$CH.USER} and the error of apm.services.get. All APM triggers of this host depend on this one.'
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: 0503e9df40ba4fd685b3e03c18c94e1f
          name: 'APM connections discovery'
          type: DEPENDENT
          key: apm.connections.discovery
          lifetime: 30d
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 1d
          description: 'Outgoing edges of this application in the last {$APM.WINDOW} minutes, including calls to services of other namespaces. Incoming calls from other namespaces belong to the host of the caller.'
          item_prototypes:
            - uuid: 7907e16f4e764aab8cd09690731b123a
              name: 'APM {#SRC} -> {#DST_NS}/{#DST}: Error rate'
              type: DEPENDENT
              key: 'apm.conn.error_rate["{#SRC}","{#DST_NS}","{#DST}","{#TYPE}"]'
              value_type: FLOAT
              units: '%'
              description: 'Calls with StatusCode=Error, %.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.data[?(@.src==''{#SRC}'' && @.dst==''{#DST}'' && @.dst_ns==''{#DST_NS}'' && @.type==''{#TYPE}'')].error_rate.first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: apm.connections.get
              tags:
                - tag: component
                  value: apm
                - tag: connection
                  value: '{#TYPE}'
                - tag: destination
                  value: '{#DST}'
                - tag: destination_namespace
                  value: '{#DST_NS}'
                - tag: source
                  value: '{#SRC}'
            - uuid: ef015e2a42844fd7876c65aab5cde944
              name: 'APM {#SRC} -> {#DST_NS}/{#DST}: Latency p95'
              type: DEPENDENT
              key: 'apm.conn.latency.p95["{#SRC}","{#DST_NS}","{#DST}","{#TYPE}"]'
              value_type: FLOAT
              units: s
              description: '95th percentile, measured by the caller (by the service for users).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.data[?(@.src==''{#SRC}'' && @.dst==''{#DST}'' && @.dst_ns==''{#DST_NS}'' && @.type==''{#TYPE}'')].p95_ms.first()'
                  error_handler: DISCARD_VALUE
                - type: IN_RANGE
                  parameters:
                    - '0'
                    - ''
                  error_handler: DISCARD_VALUE
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              master_item:
                key: apm.connections.get
              tags:
                - tag: component
                  value: apm
                - tag: connection
                  value: '{#TYPE}'
                - tag: destination
                  value: '{#DST}'
                - tag: destination_namespace
                  value: '{#DST_NS}'
                - tag: source
                  value: '{#SRC}'
            - uuid: 17fa15d0e05b44c78e443fed77e8110b
              name: 'APM {#SRC} -> {#DST_NS}/{#DST}: Calls per minute'
              type: DEPENDENT
              key: 'apm.conn.rate["{#SRC}","{#DST_NS}","{#DST}","{#TYPE}"]'
              value_type: FLOAT
              units: calls/min
              description: 'Calls per minute.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.data[?(@.src==''{#SRC}'' && @.dst==''{#DST}'' && @.dst_ns==''{#DST_NS}'' && @.type==''{#TYPE}'')].cpm.first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: apm.connections.get
              tags:
                - tag: component
                  value: apm
                - tag: connection
                  value: '{#TYPE}'
                - tag: destination
                  value: '{#DST}'
                - tag: destination_namespace
                  value: '{#DST_NS}'
                - tag: source
                  value: '{#SRC}'
          master_item:
            key: apm.connections.get
          lld_macro_paths:
            - lld_macro: '{#DST_NS}'
              path: $.dst_ns
            - lld_macro: '{#DST}'
              path: $.dst
            - lld_macro: '{#SRC}'
              path: $.src
            - lld_macro: '{#TYPE}'
              path: $.type
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return JSON.stringify(JSON.parse(value).data.map(function (r) { return {src: r.src, dst: r.dst, dst_ns: r.dst_ns, type: r.type}; }));'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: 32a8d8b69aa44c2f8bcf5fbc6ea0c0c2
          name: 'APM endpoints discovery'
          type: DEPENDENT
          key: apm.endpoints.discovery
          filter:
            evaltype: AND
            conditions:
              - macro: '{#ENDPOINT}'
                value: '{$APM.ENDPOINT.MATCHES}'
              - macro: '{#ENDPOINT}'
                value: '{$APM.ENDPOINT.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#SERVICE}'
                value: '{$APM.SERVICE.MATCHES}'
              - macro: '{#SERVICE}'
                value: '{$APM.SERVICE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          lifetime: 30d
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 1d
          description: 'Busiest {$APM.ENDPOINT.LIMIT} endpoints per service (SpanName of entry spans).'
          item_prototypes:
            - uuid: 9b477d54a8ec48e187dae7bfe85fb886
              name: 'APM {#SERVICE} {#ENDPOINT}: Apdex'
              type: DEPENDENT
              key: 'apm.endpoint.apdex["{#SERVICE}","{#ENDPOINT}"]'
              value_type: FLOAT
              description: 'Apdex with T={$APM.APDEX.T}ms.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.data[?(@.service==''{#SERVICE}'' && @.endpoint==''{#ENDPOINT}'')].apdex.first()'
                  error_handler: DISCARD_VALUE
                - type: IN_RANGE
                  parameters:
                    - '0'
                    - '1'
                  error_handler: DISCARD_VALUE
              master_item:
                key: apm.endpoints.get
              tags:
                - tag: component
                  value: apm
                - tag: endpoint
                  value: '{#ENDPOINT}'
                - tag: service
                  value: '{#SERVICE}'
            - uuid: 6c719e673686415882a9c0c68318da5d
              name: 'APM {#SERVICE} {#ENDPOINT}: Error rate'
              type: DEPENDENT
              key: 'apm.endpoint.error_rate["{#SERVICE}","{#ENDPOINT}"]'
              value_type: FLOAT
              units: '%'
              description: 'errors / requests * 100.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.data[?(@.service==''{#SERVICE}'' && @.endpoint==''{#ENDPOINT}'')].error_rate.first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: apm.endpoints.get
              tags:
                - tag: component
                  value: apm
                - tag: endpoint
                  value: '{#ENDPOINT}'
                - tag: service
                  value: '{#SERVICE}'
            - uuid: 36932de1e60c4c888fb5129d8714e8c5
              name: 'APM {#SERVICE} {#ENDPOINT}: Latency avg'
              type: DEPENDENT
              key: 'apm.endpoint.latency.avg["{#SERVICE}","{#ENDPOINT}"]'
              value_type: FLOAT
              units: s
              description: 'Average duration.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.data[?(@.service==''{#SERVICE}'' && @.endpoint==''{#ENDPOINT}'')].avg_ms.first()'
                  error_handler: DISCARD_VALUE
                - type: IN_RANGE
                  parameters:
                    - '0'
                    - ''
                  error_handler: DISCARD_VALUE
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              master_item:
                key: apm.endpoints.get
              tags:
                - tag: component
                  value: apm
                - tag: endpoint
                  value: '{#ENDPOINT}'
                - tag: service
                  value: '{#SERVICE}'
            - uuid: 50d87dd12d1e49be83c55d8771d0e359
              name: 'APM {#SERVICE} {#ENDPOINT}: Latency p95'
              type: DEPENDENT
              key: 'apm.endpoint.latency.p95["{#SERVICE}","{#ENDPOINT}"]'
              value_type: FLOAT
              units: s
              description: '95th percentile.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.data[?(@.service==''{#SERVICE}'' && @.endpoint==''{#ENDPOINT}'')].p95_ms.first()'
                  error_handler: DISCARD_VALUE
                - type: IN_RANGE
                  parameters:
                    - '0'
                    - ''
                  error_handler: DISCARD_VALUE
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              master_item:
                key: apm.endpoints.get
              tags:
                - tag: component
                  value: apm
                - tag: endpoint
                  value: '{#ENDPOINT}'
                - tag: service
                  value: '{#SERVICE}'
            - uuid: ce805463a0ad4e3a80ad62583dd9bb56
              name: 'APM {#SERVICE} {#ENDPOINT}: Requests per minute'
              type: DEPENDENT
              key: 'apm.endpoint.rate["{#SERVICE}","{#ENDPOINT}"]'
              value_type: FLOAT
              units: req/min
              description: 'Requests per minute.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.data[?(@.service==''{#SERVICE}'' && @.endpoint==''{#ENDPOINT}'')].rpm.first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: apm.endpoints.get
              tags:
                - tag: component
                  value: apm
                - tag: endpoint
                  value: '{#ENDPOINT}'
                - tag: service
                  value: '{#SERVICE}'
            - uuid: e44ec2272d174e4a8df9fcdae96d1676
              name: 'APM {#SERVICE} {#ENDPOINT}: Requests'
              type: DEPENDENT
              key: 'apm.endpoint.requests["{#SERVICE}","{#ENDPOINT}"]'
              description: 'Requests in the last {$APM.WINDOW} minutes.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.data[?(@.service==''{#SERVICE}'' && @.endpoint==''{#ENDPOINT}'')].requests.first()'
                  error_handler: DISCARD_VALUE
              master_item:
