<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="/static/css/hud.css">

<body>
<div id="escena"></div>

<aside id="problemas" class="panel">

      <button data-vista="tour" title="Recorrido automático">Recorrido</button>

      <button data-dia="auto" title="Ciclo día y noche">Ciclo</button>

  </div>

<script type="module" src="/static/js/main.js"></script>
