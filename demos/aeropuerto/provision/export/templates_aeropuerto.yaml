                  value: '{#SERVICE}'
            - uuid: 4b584b7da3c94bc98959e3f9189bba7a
              name: 'APM {#SERVICE}: Latency p99'
              type: DEPENDENT
              key: 'apm.latency.p99[{#SERVICE}]'
              value_type: FLOAT
              units: s
              description: '99th percentile of entry spans.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.data[?(@.service==''{#SERVICE}'' && @.type==''service'')].p99_ms.first()'
                  error_handler: DISCARD_VALUE
                - type: IN_RANGE
                  parameters:
                    - '0'
                    - ''
                  error_handler: DISCARD_VALUE
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              master_item:
                key: apm.services.get
              tags:
                - tag: component
                  value: apm
                - tag: service
                  value: '{#SERVICE}'
            - uuid: 73169f1b884a419a8524370552bd31ec
              name: 'APM {#SERVICE}: Requests per minute'
              type: DEPENDENT
