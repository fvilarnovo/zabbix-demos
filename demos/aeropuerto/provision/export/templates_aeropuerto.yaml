zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: 2145f5e8931d4251a853b8c0e0cfbd40
      name: Templates/Aeropuerto
    - uuid: 8cf958f80c814d118fa9c1cc47248ebb
      name: Templates/Applications
  host_groups:
    - uuid: b7f8225e7c0548c582f19f53b0e5f40c
      name: Applications
  templates:
    - uuid: 538e6ffdace84e11aa1e7bd1d8080940
      template: 'Aeropuerto APM by Telemetry query'
      name: 'Aeropuerto APM by Telemetry query'
      description: 'Latencia y errores del recorrido de check-in, con ítems Telemetry query de Zabbix 8.0.'
      groups:
        - name: Templates/Aeropuerto
      items:
        - uuid: 90cb8eda5c2741398568c5f9a24de678
          name: 'APM check-in: p95'
          type: TELEMETRY_QUERY
          key: aero.apm.checkin.p95
          delay: 30s
          value_type: FLOAT
          units: s
          preprocessing:
            - type: JSONPATH
              parameters:
                - $[0].p95
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: MULTIPLIER
              parameters:
                - '1.0E-9'
          timeout: 5s
          time_shift: 15s
          lookback_limit: 1m
          granularity: 1m
          query:
            columns:
              - column: ServiceName
            aggregated_columns:
              - function: PERCENTILE
                column: Duration
                parameters:
                  - '95'
                alias: p95
            filter:
              conditions:
                - column: ResourceAttributes
                  attribute_key: service.namespace
                  value: '{$AERO.NS}'
                - column: ServiceName
                  value: kiosco
                - column: SpanKind
                  value: Server
                - column: SpanName
                  value: 'POST /checkin'
          tags:
            - tag: component
              value: apm
          triggers:
            - uuid: e4013db3af014086b2b0751de224faf4
              expression: 'last(/Aeropuerto APM by Telemetry query/aero.apm.checkin.p95)>{$AERO.CHECKIN.P95.MAX}'
              name: 'APM check-in: latencia p95 alta'
              priority: AVERAGE
              tags:
                - tag: demo
                  value: aeropuerto
                - tag: nivel
                  value: apm
                - tag: recurso
                  value: kiosco
                - tag: terminal
                  value: T1
        - uuid: 92d9d68a53c747f198f522b368de5a62
          name: 'APM pasajes: errores por minuto'
          type: TELEMETRY_QUERY
          key: aero.apm.pasajes.errores
          delay: 30s
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $[0].errores
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          timeout: 5s
          time_shift: 15s
          lookback_limit: 1m
          granularity: 1m
          query:
            columns:
              - column: ServiceName
            aggregated_columns:
              - alias: errores
            filter:
              conditions:
                - column: ResourceAttributes
                  attribute_key: service.namespace
                  value: '{$AERO.NS}'
                - column: ServiceName
                  value: pasajes
                - column: SpanKind
                  value: Server
                - column: SpanName
                  value: 'POST /emitir'
                - column: StatusCode
                  value: Error
          tags:
            - tag: component
              value: apm
        - uuid: 13cd7a8bd0f04a8c991a8322057082f5
          name: 'APM pasajes: tasa de errores'
          type: CALCULATED
          key: aero.apm.pasajes.error_pct
          delay: 30s
          value_type: FLOAT
          units: '%'
          params: '100*last(//aero.apm.pasajes.errores)/max(last(//aero.apm.pasajes.total),1)'
          tags:
            - tag: component
              value: apm
          triggers:
            - uuid: 6b9342099be44c3fa9665028c25e9143
              expression: 'last(/Aeropuerto APM by Telemetry query/aero.apm.pasajes.error_pct)>{$AERO.PASAJES.ERROR.MAX}'
              name: 'APM pasajes: tasa de errores alta'
              priority: HIGH
              tags:
                - tag: demo
                  value: aeropuerto
                - tag: nivel
                  value: apm
                - tag: recurso
                  value: pasajes
                - tag: terminal
                  value: T1
        - uuid: af138ea1438546d991ab17e3b85e6076
          name: 'APM pasajes: p95'
          type: TELEMETRY_QUERY
          key: aero.apm.pasajes.p95
          delay: 30s
          value_type: FLOAT
          units: s
          preprocessing:
            - type: JSONPATH
              parameters:
                - $[0].p95
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: MULTIPLIER
              parameters:
                - '1.0E-9'
          timeout: 5s
          time_shift: 15s
          lookback_limit: 1m
          granularity: 1m
          query:
            columns:
              - column: ServiceName
            aggregated_columns:
              - function: PERCENTILE
                column: Duration
                parameters:
                  - '95'
                alias: p95
            filter:
              conditions:
                - column: ResourceAttributes
                  attribute_key: service.namespace
                  value: '{$AERO.NS}'
                - column: ServiceName
                  value: pasajes
                - column: SpanKind
                  value: Server
                - column: SpanName
                  value: 'POST /emitir'
          tags:
            - tag: component
              value: apm
          triggers:
            - uuid: b062acfbab464f3e9408ad26b97c7287
              expression: 'last(/Aeropuerto APM by Telemetry query/aero.apm.pasajes.p95)>{$AERO.PASAJES.P95.MAX}'
              name: 'APM pasajes: latencia alta'
              priority: HIGH
              tags:
                - tag: demo
                  value: aeropuerto
                - tag: nivel
                  value: apm
                - tag: recurso
                  value: pasajes
                - tag: terminal
                  value: T1
        - uuid: 4a395e0d19ab4cd88239a7faa711cae4
          name: 'APM pasajes: emisiones por minuto'
          type: TELEMETRY_QUERY
          key: aero.apm.pasajes.total
          delay: 30s
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $[0].total
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          timeout: 5s
          time_shift: 15s
          lookback_limit: 1m
          granularity: 1m
          query:
            columns:
              - column: ServiceName
            aggregated_columns:
              - alias: total
            filter:
              conditions:
                - column: ResourceAttributes
                  attribute_key: service.namespace
                  value: '{$AERO.NS}'
                - column: ServiceName
                  value: pasajes
                - column: SpanKind
                  value: Server
                - column: SpanName
                  value: 'POST /emitir'
          tags:
            - tag: component
              value: apm
      tags:
        - tag: demo
          value: aeropuerto
      macros:
        - macro: '{$AERO.CHECKIN.P95.MAX}'
          value: '3'
        - macro: '{$AERO.NS}'
          value: aeropuerto
        - macro: '{$AERO.PASAJES.ERROR.MAX}'
          value: '20'
        - macro: '{$AERO.PASAJES.P95.MAX}'
          value: '1.5'
    - uuid: 426fc4964cab4a45b137d3161aa3f12a
      template: 'Aeropuerto KPIs by ClickHouse'
      name: 'Aeropuerto KPIs by ClickHouse'
      description: 'KPI de negocio del aeropuerto, calculados desde las trazas en ClickHouse.'
      groups:
        - name: Templates/Aeropuerto
      items:
        - uuid: 8cc59114096346c39bbd7ce161f2aa34
          name: 'Aeropuerto: consulta de KPI a ClickHouse'
          type: HTTP_AGENT
          key: aero.kpi.get
          delay: 30s
          history: 1h
          value_type: TEXT
          timeout: 15s
          url: '{$CH.URL}'
          posts: |
            
            WITH
                toDate(Timestamp, 'America/Mexico_City') = toDate(now(), 'America/Mexico_City') AS hoy,
                Timestamp > now() - toIntervalMinute(15) AS ult_15m,
                Timestamp > now() - toIntervalMinute(60)  AS ult_1h,
                ServiceName = 'kiosco' AND SpanName = 'POST /checkin' AS es_checkin,
                StatusCode = 'Error' AS fallo,
                toUInt32OrZero(SpanAttributes['aeropuerto.valijas']) AS valijas
             SELECT
                countIf(hoy AND es_checkin AND NOT fallo) AS checkins_hoy,
                countIf(ult_15m AND es_checkin AND fallo) AS checkins_fallidos_15m,
                sumIf(valijas, hoy AND es_checkin AND NOT fallo)  AS valijas_hoy,
                sumIf(valijas, ult_1h AND es_checkin AND NOT fallo) AS valijas_1h,
                uniqExactIf(SpanAttributes['aeropuerto.vuelo'], ult_15m AND es_checkin AND SpanAttributes['aeropuerto.demorado']  = 'true') AS vuelos_demorados_15m
            FROM zabbix.otel_traces
            WHERE Timestamp > now() - toIntervalHour(24)
              AND ResourceAttributes['service.namespace'] = '{$AERO.NS}'
              AND SpanKind = 'Server'
             FORMAT JSONEachRow
          headers:
            - name: X-ClickHouse-User
              value: '{$CH.USER}'
            - name: X-ClickHouse-Key
              value: '{$CH.PASSWORD}'
          request_method: POST
        - uuid: 2c19c7a2d2a444cd9709d4b5ed7816c2
          name: 'Aeropuerto: Check-ins fallidos en 15 min'
          type: DEPENDENT
          key: 'aero.kpi[checkins_fallidos_15m]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.checkins_fallidos_15m
          master_item:
            key: aero.kpi.get
          tags:
            - tag: component
              value: negocio
        - uuid: 22bce0a3cf294b80896d2209c1ad6ed5
          name: 'Aeropuerto: Check-ins hoy'
          type: DEPENDENT
          key: 'aero.kpi[checkins_hoy]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.checkins_hoy
          master_item:
            key: aero.kpi.get
          tags:
            - tag: component
              value: negocio
        - uuid: ce1c2ea008834c8eaae0813a232c7a27
          name: 'Aeropuerto: Valijas en la última hora'
          type: DEPENDENT
          key: 'aero.kpi[valijas_1h]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.valijas_1h
          master_item:
            key: aero.kpi.get
          tags:
            - tag: component
              value: negocio
        - uuid: 6dbefc6c6cd0480e9727f66b6bab2984
          name: 'Aeropuerto: Valijas hoy'
          type: DEPENDENT
          key: 'aero.kpi[valijas_hoy]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.valijas_hoy
          master_item:
            key: aero.kpi.get
          tags:
            - tag: component
              value: negocio
        - uuid: 9d17174f89cf435d8691470f73460c00
          name: 'Aeropuerto: Vuelos con check-in demorado (15 min)'
          type: DEPENDENT
          key: 'aero.kpi[vuelos_demorados_15m]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.vuelos_demorados_15m
          master_item:
            key: aero.kpi.get
          tags:
            - tag: component
              value: negocio
      tags:
        - tag: demo
          value: aeropuerto
      macros:
        - macro: '{$AERO.NS}'
          value: aeropuerto
        - macro: '{$CH.PASSWORD}'
        - macro: '{$CH.URL}'
          value: 'http://clickhouse:8123/'
        - macro: '{$CH.USER}'
          value: zabbix
