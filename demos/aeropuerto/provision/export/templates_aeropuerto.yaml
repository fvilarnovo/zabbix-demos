                  value: '{#SERVICE}'
            - uuid: a6c37b388f6f4b608dcdc63ee69636c9
              name: 'APM {#SERVICE}: Requests'
              type: DEPENDENT
              key: 'apm.requests[{#SERVICE}]'
              description: 'Entry spans (Server/Consumer) in the last {$APM.WINDOW} minutes.'
              preprocessing:
                - type: JSONPATH
