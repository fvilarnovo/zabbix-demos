          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
          units: '!USD'
          tags:
            - tag: aplicacion
              value: pms
            - tag: proveedor
              value: gcp
            - tag: sitio
              value: gran-forum
        - name: 'Hotel: Costo diario de portal-wifi en AWS'
          type: TRAP
          key: 'hotel.finops.costo[portal-wifi,aws]'
          value_type: FLOAT
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
          units: '!USD'
          tags:
            - tag: aplicacion
              value: portal-wifi
            - tag: proveedor
              value: aws
            - tag: sitio
              value: gran-forum
        - name: 'Hotel: Costo diario de portal-wifi en GCP'
          type: TRAP
          key: 'hotel.finops.costo[portal-wifi,gcp]'
          value_type: FLOAT
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
          units: '!USD'
          tags:
            - tag: aplicacion
              value: portal-wifi
            - tag: proveedor
              value: gcp
            - tag: sitio
              value: gran-forum
        - name: 'Hotel: Costo diario de reservas-web en AWS'
          type: TRAP
          key: 'hotel.finops.costo[reservas-web,aws]'
          value_type: FLOAT
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
          units: '!USD'
          tags:
            - tag: aplicacion
              value: reservas-web
            - tag: proveedor
              value: aws
            - tag: sitio
              value: gran-forum
        - name: 'Hotel: Costo diario de reservas-web en GCP'
          type: TRAP
          key: 'hotel.finops.costo[reservas-web,gcp]'
          value_type: FLOAT
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
          units: '!USD'
          tags:
            - tag: aplicacion
              value: reservas-web
            - tag: proveedor
              value: gcp
            - tag: sitio
              value: gran-forum
        - name: 'Hotel: Costo por reserva'
          type: CALCULATED
          key: hotel.finops.costo_por_reserva
          delay: 30s
          value_type: FLOAT
          units: '!USD'
          params: '(last(/AWS Cost/aws.daily.service.total.cost) + last(/Google Cloud Cost/gcp.cost.daily.summary.yesterday)) * (last(/Hotel Gran Forum - Negocio/hotel.kpi[reservas_24h])>0) / max(last(/Hotel Gran Forum - Negocio/hotel.kpi[reservas_24h]),1)'
          tags:
            - tag: capa
              value: negocio
            - tag: sitio
              value: gran-forum
      tags:
        - tag: sitio
          value: gran-forum
    - host: 'Hotel Gran Forum - Negocio'
      name: 'Hotel Gran Forum - Negocio'
