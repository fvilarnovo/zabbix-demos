        - name: 'Acumulado del mes reportado por la facturación'
          type: TRAP
          key: finops.month.acumulado
          value_type: FLOAT
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
          units: '!USD'
          tags:
            - tag: component
              value: budget
            - tag: target
              value: aws
        - name: 'Proyección sobre el presupuesto'
          type: CALCULATED
          key: finops.month.budget.pct
          history: 90d
          value_type: FLOAT
          units: '%'
          params: '100 * last(/AWS Cost/finops.month.forecast) / {$BUDGET.MONTH}'
          tags:
            - tag: component
              value: budget
            - tag: target
              value: aws
        - name: 'Días que faltan para terminar el mes'
          type: TRAP
          key: finops.month.dias_restantes
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
          tags:
            - tag: component
              value: budget
            - tag: target
              value: aws
        - name: 'Proyección de gasto a fin de mes'
          type: CALCULATED
          key: finops.month.forecast
          history: 90d
          value_type: FLOAT
          units: '!USD'
          params: 'last(/AWS Cost/finops.month.acumulado) + avg(/AWS Cost/aws.daily.service.total.cost,7d) * last(/AWS Cost/finops.month.dias_restantes)'
          tags:
            - tag: component
              value: budget
            - tag: target
              value: aws
          triggers:
            - expression: 'last(/AWS Cost/finops.month.forecast)>{$BUDGET.MONTH}'
              name: 'AWS: la proyección del mes supera el presupuesto'
              opdata: 'Proyección {ITEM.LASTVALUE1} de {$BUDGET.MONTH} USD'
              priority: AVERAGE
              manual_close: 'YES'
              tags:
                - tag: component
                  value: budget
                - tag: scope
                  value: forecast
                - tag: target
                  value: aws
        - name: 'Gasto acumulado del mes'
          type: CALCULATED
          key: finops.month.mtd
          history: 90d
          value_type: FLOAT
          units: '!USD'
          params: 'last(/AWS Cost/finops.month.acumulado)'
          tags:
            - tag: component
              value: budget
            - tag: target
              value: aws
          triggers:
            - expression: 'last(/AWS Cost/finops.month.mtd)>0.8*{$BUDGET.MONTH} and dayofmonth()<20'
              name: 'AWS: el 80% del presupuesto se consumió antes del día 20'
              opdata: 'Acumulado {ITEM.LASTVALUE1} de {$BUDGET.MONTH} USD'
              priority: WARNING
              manual_close: 'YES'
              tags:
