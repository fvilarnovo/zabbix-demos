  hosts:
    - host: apm-discovery-test
      name: apm-discovery-test
      description: 'Host de prueba del discovery v3. Ventanas de 24 h y usuario default: temporales.'
      templates:
        - name: 'APM applications discovery by ClickHouse HTTP v3'
      groups:
        - name: APM
      macros:
        - macro: '{$APM.DISCOVERY.WINDOW}'
          value: '60'
        - macro: '{$APM.NAMESPACE.MATCHES}'
          value: ^hotel$
        - macro: '{$APM.WINDOW}'
          value: '5'
        - macro: '{$CH.USER}'
          value: default
    - host: 'AWS Cost'
      name: 'AWS Cost'
      groups:
        - name: 'Cloud / FinOps'
        - name: Hotel/Cloud
      interfaces:
        - interface_ref: if1
      items:
        - name: 'Account [111122223333]: Total yearly cost'
          type: TRAP
          key: 'aws.account.yearly.total.cost["111122223333"]'
          value_type: FLOAT
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
          units: '!USD'
          tags:
            - tag: component
              value: yearly-account
            - tag: yearly-account
