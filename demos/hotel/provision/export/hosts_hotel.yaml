      groups:
        - name: Hotel/Negocio
      tags:
        - tag: sitio
          value: gran-forum
    - host: 'Hotel Gran Forum - OT'
      name: 'Hotel Gran Forum - OT'
      groups:
        - name: Hotel/OT
      items:
        - name: 'Control: reinicio de ventanas CEP'
          type: TRAP
          key: hotel.cep.reinicio
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
          tags:
            - tag: recurso
              value: reinicio
          triggers:
            - expression: 'last(/Hotel Gran Forum - OT/hotel.cep.reinicio)=1'
              name: 'Control: reinicio de ventana de emergencia'
              tags:
                - tag: capa
                  value: control
                - tag: circuito
                  value: emergencia
                - tag: recurso
                  value: reinicio
                - tag: sitio
                  value: gran-forum
            - expression: 'last(/Hotel Gran Forum - OT/hotel.cep.reinicio)=1'
              name: 'Control: reinicio de ventana principal'
              tags:
                - tag: capa
                  value: control
                - tag: circuito
                  value: principal
                - tag: recurso
                  value: reinicio
                - tag: sitio
                  value: gran-forum
        - name: 'Hotel: Elevador 1 (1=en servicio)'
          type: TRAP
          key: 'hotel.elev.state[1]'
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
          valuemap:
            name: 'Hotel: elevador'
          tags:
            - tag: recurso
              value: elevador
          triggers:
            - expression: 'last(/Hotel Gran Forum - OT/hotel.elev.state[1])=0'
              name: 'Elevador 1 fuera de servicio'
              priority: AVERAGE
              tags:
                - tag: capa
                  value: servicio
                - tag: circuito
                  value: emergencia
                - tag: recurso
                  value: elevador
                - tag: sitio
                  value: gran-forum
        - name: 'Hotel: Elevador 2 (1=en servicio)'
          type: TRAP
          key: 'hotel.elev.state[2]'
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
          valuemap:
            name: 'Hotel: elevador'
          tags:
            - tag: recurso
              value: elevador
          triggers:
            - expression: 'last(/Hotel Gran Forum - OT/hotel.elev.state[2])=0'
              name: 'Elevador 2 fuera de servicio'
              priority: AVERAGE
              tags:
                - tag: capa
                  value: servicio
                - tag: circuito
                  value: principal
                - tag: recurso
                  value: elevador
                - tag: sitio
                  value: gran-forum
        - name: 'Hotel: Elevador 3 (1=en servicio)'
          type: TRAP
          key: 'hotel.elev.state[3]'
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
          valuemap:
            name: 'Hotel: elevador'
          tags:
            - tag: recurso
              value: elevador
          triggers:
            - expression: 'last(/Hotel Gran Forum - OT/hotel.elev.state[3])=0'
              name: 'Elevador 3 fuera de servicio'
              priority: AVERAGE
              tags:
                - tag: capa
                  value: servicio
                - tag: circuito
                  value: principal
                - tag: recurso
                  value: elevador
                - tag: sitio
                  value: gran-forum
        - name: 'Hotel: Combustible del generador'
          type: TRAP
          key: hotel.gen.fuel_pct
          value_type: FLOAT
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
          units: '%'
          tags:
            - tag: recurso
              value: generador
        - name: 'Hotel: Batería de arranque del generador (mínimo 11.5 V)'
          type: TRAP
          key: hotel.gen.start_battery_v
          value_type: FLOAT
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
          units: V
          tags:
            - tag: recurso
              value: generador
        - name: 'Hotel: Generador (0=parado, 1=arrancando, 2=en marcha, 3=falla)'
          type: TRAP
          key: hotel.gen.state
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
          valuemap:
            name: 'Hotel: generador'
          tags:
            - tag: recurso
              value: generador
          triggers:
            - expression: 'last(/Hotel Gran Forum - OT/hotel.gen.state)=3'
              name: 'Generador: falla de arranque'
              priority: HIGH
              tags:
                - tag: capa
                  value: energia
                - tag: circuito
                  value: principal
                - tag: recurso
                  value: generador
                - tag: sitio
                  value: gran-forum
        - name: 'Hotel: Red eléctrica (1=ok)'
          type: TRAP
          key: hotel.grid.state
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
          valuemap:
            name: 'Hotel: red'
          tags:
            - tag: recurso
              value: red
          triggers:
            - expression: 'last(/Hotel Gran Forum - OT/hotel.grid.state)=0'
              name: 'Red eléctrica: sin suministro'
              priority: HIGH
              tags:
                - tag: capa
                  value: energia
                - tag: circuito
                  value: principal
                - tag: recurso
                  value: red
                - tag: sitio
                  value: gran-forum
        - name: 'Hotel: Tensión de red'
          type: TRAP
          key: hotel.grid.voltage
          value_type: FLOAT
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
          units: V
          tags:
            - tag: recurso
              value: red
        - name: 'Hotel: Chiller (1=en marcha)'
          type: TRAP
          key: hotel.hvac.chiller_state
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
          valuemap:
            name: 'Hotel: chiller'
          tags:
            - tag: recurso
              value: hvac
          triggers:
            - expression: 'last(/Hotel Gran Forum - OT/hotel.hvac.chiller_state)=0'
              name: 'Aire acondicionado: chiller detenido'
              priority: HIGH
              tags:
                - tag: capa
                  value: servicio
                - tag: circuito
                  value: principal
                - tag: recurso
                  value: hvac
                - tag: sitio
                  value: gran-forum
        - name: 'Hotel: Temperatura del lobby'
          type: TRAP
          key: hotel.hvac.lobby_temp
          value_type: FLOAT
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
          units: °C
          tags:
            - tag: recurso
              value: hvac
          triggers:
            - expression: 'last(/Hotel Gran Forum - OT/hotel.hvac.lobby_temp)>26'
              name: 'Lobby: temperatura alta'
              priority: WARNING
              tags:
                - tag: capa
                  value: servicio
                - tag: circuito
                  value: principal
                - tag: recurso
                  value: hvac
                - tag: sitio
                  value: gran-forum
        - name: 'Hotel: Temperatura de agua del chiller'
          type: TRAP
          key: hotel.hvac.supply_temp
          value_type: FLOAT
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
          units: °C
          tags:
            - tag: recurso
              value: hvac
        - name: 'Hotel: Carga de batería de la UPS'
          type: TRAP
          key: hotel.ups.battery_pct
          value_type: FLOAT
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
          units: '%'
          tags:
            - tag: recurso
              value: ups
        - name: 'Hotel: Carga de salida de la UPS'
          type: TRAP
          key: hotel.ups.load_pct
          value_type: FLOAT
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
          units: '%'
          tags:
            - tag: recurso
              value: ups
        - name: 'Hotel: UPS en batería (1=sí)'
          type: TRAP
          key: hotel.ups.on_battery
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
          valuemap:
            name: 'Hotel: origen'
          tags:
            - tag: recurso
              value: ups
          triggers:
            - expression: 'last(/Hotel Gran Forum - OT/hotel.ups.on_battery)=1'
              name: 'UPS en batería'
              priority: AVERAGE
              tags:
                - tag: capa
                  value: energia
                - tag: circuito
                  value: principal
                - tag: recurso
                  value: ups
                - tag: sitio
                  value: gran-forum
        - name: 'Hotel: Autonomía de la UPS en minutos'
          type: TRAP
          key: hotel.ups.runtime_min
          value_type: FLOAT
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
          units: min
          tags:
            - tag: recurso
              value: ups
          triggers:
            - expression: 'last(/Hotel Gran Forum - OT/hotel.ups.runtime_min)<10'
              name: 'UPS: autonomía baja'
              priority: HIGH
              tags:
                - tag: capa
                  value: energia
                - tag: circuito
                  value: principal
                - tag: recurso
                  value: ups
                - tag: sitio
                  value: gran-forum
        - name: 'Hotel: Puntos de acceso Wi-Fi activos (de 48)'
          type: TRAP
          key: hotel.wifi.aps_up
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
          tags:
            - tag: recurso
              value: wifi
          triggers:
            - expression: 'last(/Hotel Gran Forum - OT/hotel.wifi.aps_up)<24'
              name: 'Wi-Fi: la mayoría de los puntos de acceso caídos'
              priority: HIGH
              tags:
                - tag: capa
                  value: servicio
                - tag: circuito
                  value: principal
                - tag: recurso
                  value: wifi
                - tag: sitio
                  value: gran-forum
        - name: 'Hotel: Clientes Wi-Fi conectados'
          type: TRAP
          key: hotel.wifi.clients
          allowed_hosts: '{$TRAPPER.ALLOWED_HOSTS}'
          tags:
            - tag: recurso
              value: wifi
      tags:
        - tag: sitio
          value: gran-forum
      valuemaps:
        - name: 'Hotel: chiller'
          mappings:
            - value: '0'
              newvalue: Detenido
            - value: '1'
              newvalue: 'En marcha'
        - name: 'Hotel: elevador'
          mappings:
            - value: '0'
              newvalue: 'Fuera de servicio'
            - value: '1'
              newvalue: 'En servicio'
        - name: 'Hotel: generador'
          mappings:
            - value: '0'
              newvalue: Parado
            - value: '1'
              newvalue: Arrancando
            - value: '2'
              newvalue: 'En marcha'
            - value: '3'
              newvalue: Falla
        - name: 'Hotel: origen'
          mappings:
            - value: '0'
              newvalue: Red
            - value: '1'
              newvalue: Batería
        - name: 'Hotel: red'
          mappings:
            - value: '0'
              newvalue: 'Sin suministro'
            - value: '1'
              newvalue: 'Con suministro'
