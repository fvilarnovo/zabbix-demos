<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Hotel Gran Zabbix 8.0{% endblock %}</title>
<style>
  :root {
    --tinta: #1f2a30; --suave: #5c6b73; --fondo: #faf7f2; --papel: #ffffff; --linea: #e5ded3;
    --verde: #1f4d46; --verde-oscuro: #163a35; --oro: #b0853c; --rojo: #a33a2c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--tinta); font: 17px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1, h2, h3, .marca { font-family: Georgia, "Times New Roman", serif; font-weight: 400; }
  .aviso { background: var(--tinta); color: #fff; text-align: center; font-size: 14px; padding: 6px 16px; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 18px 32px; background: var(--papel); border-bottom: 1px solid var(--linea); }
  .marca { font-size: 24px; color: var(--verde); text-decoration: none; }
  header nav { color: var(--suave); font-size: 15px; display: flex; align-items: center; gap: 14px; }
  .zbx-logo { height: 26px; width: auto; display: block; border-radius: 3px; }
  main { max-width: 1040px; margin: 0 auto; padding: 32px 24px 64px; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 6px; padding: 12px 20px; background: var(--verde); color: #fff; }
  button:hover { background: var(--verde-oscuro); }
  a { color: var(--verde); }
  {% block estilos %}{% endblock %}
  @media (max-width: 640px) { header { padding: 14px 16px; } main { padding: 24px 16px 48px; } }
</style>
</head>
<body>
<div class="aviso">Hotel ficticio para una demostración. Datos simulados, no se realizan cargos.</div>

</header>
<main>{% block contenido %}{% endblock %}</main>
</body>
</html>
