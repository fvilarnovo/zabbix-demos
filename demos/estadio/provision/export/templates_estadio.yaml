              type: DEPENDENT
              key: 'apm.health[{#SERVICE}]'
              description: '2 = problem, 1 = warning, 0 = healthy, with the same macros as the triggers.'
              valuemap:
                name: 'APM health'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value).data;
                      for (var i = 0; i < d.length; i++) {
                          var r = d[i];
                          if (r.service !== '{#SERVICE}' || r.type !== 'service') continue;
                          if (r.requests == 0) return  0;
                          if (r.error_rate >= {$APM.ERROR.MAX:"{#SERVICE}"} || r.p95_ms >= {$APM.P95.MAX:"{#SERVICE}"}) return 2;
                          if (r.error_rate >= {$APM.ERROR.WARN:"{#SERVICE}"} || r.p95_ms >=  {$APM.P95.WARN:"{#SERVICE}"}) return 1;
                          return 0;
