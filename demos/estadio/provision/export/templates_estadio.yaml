    - uuid: 61b072459ad04579a5825622404c258a
      template: 'Estadio KPIs by ClickHouse'
      name: 'Estadio KPIs by ClickHouse'
      description: 'Entradas, ventas de la tienda e ingresos por molinete, calculados desde las trazas en ClickHouse.'
      groups:
        - name: Templates/Estadio
      items:
        - uuid: de8fb7354b7e4259af17bfc08c60789c
          name: 'Estadio: consulta de KPI a ClickHouse'
          type: HTTP_AGENT
          key: est.kpi.get
          delay: 30s
          history: 1h
          value_type: TEXT
          timeout: 15s
          url: '{$CH.URL}'
          posts: |
            WITH
                toDate(Timestamp, 'America/Mexico_City') = toDate(now(), 'America/Mexico_City') AS hoy,
                Timestamp > now() - toIntervalMinute(15) AS ult_15m,
                ServiceName = 'boleteria' AND SpanName = 'POST /entrada' AS es_entrada,
                ServiceName = 'tienda' AND SpanName = 'POST /compra' AS es_venta,
                ServiceName = 'accesos' AND SpanName = 'POST /validar' AS es_acceso,
                StatusCode = 'Error' AS fallo,
                toFloat64OrZero(SpanAttributes['estadio.monto']) AS monto
             SELECT
                countIf(hoy AND es_entrada AND NOT fallo) AS entradas_hoy,
                round(sumIf(monto, hoy AND es_entrada AND NOT fallo)) AS recaudacion_entradas_hoy,
                countIf(hoy AND es_venta AND NOT fallo) AS ventas_tienda_hoy,
                round(sumIf(monto, hoy AND es_venta AND NOT fallo)) AS recaudacion_tienda_hoy,
                countIf(ult_15m AND es_acceso AND NOT fallo) AS accesos_15m,
                countIf(ult_15m AND es_acceso AND fallo) AS accesos_rechazados_15m,
                countIf(ult_15m AND es_venta AND fallo) AS ventas_fallidas_15m,
                countIf(ult_15m AND es_entrada AND fallo) AS entradas_fallidas_15m
            FROM zabbix.otel_traces
            WHERE Timestamp > now() - toIntervalHour(24)
              AND ResourceAttributes['service.namespace'] = '{$EST.NS}'
              AND SpanKind = 'Server'
             FORMAT JSONEachRow
          headers:
            - name: X-ClickHouse-User
              value: '{$CH.USER}'
            - name: X-ClickHouse-Key
              value: '{$CH.PASSWORD}'
          request_method: POST
        - uuid: 26d36c544e2444c08580c7233227cf97
          name: 'Negocio: ingresos validados en 15 min'
          type: DEPENDENT
          key: 'est.kpi[accesos_15m]'
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.accesos_15m
          master_item:
            key: est.kpi.get
          tags:
            - tag: component
              value: negocio
        - uuid: 67e557d4ea894853899858bb1a426d06
          name: 'Negocio: ingresos rechazados en 15 min'
          type: DEPENDENT
          key: 'est.kpi[accesos_rechazados_15m]'
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.accesos_rechazados_15m
          master_item:
            key: est.kpi.get
          tags:
            - tag: component
              value: negocio
        - uuid: d2cfd719da5b4842b0621f415ca8bc13
          name: 'Negocio: ventas de entradas fallidas en 15 min'
          type: DEPENDENT
          key: 'est.kpi[entradas_fallidas_15m]'
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.entradas_fallidas_15m
          master_item:
            key: est.kpi.get
          tags:
            - tag: component
              value: negocio
        - uuid: cbf7e2202fbe4e78a5e859794a180bf4
          name: 'Negocio: entradas vendidas hoy'
          type: DEPENDENT
          key: 'est.kpi[entradas_hoy]'
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.entradas_hoy
          master_item:
            key: est.kpi.get
          tags:
            - tag: component
              value: negocio
        - uuid: a0281ce58d7e416aa8d5fda073f8dd65
          name: 'Negocio: recaudación de boletería hoy'
          type: DEPENDENT
          key: 'est.kpi[recaudacion_entradas_hoy]'
          value_type: FLOAT
