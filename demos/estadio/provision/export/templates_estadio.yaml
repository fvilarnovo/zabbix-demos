    - uuid: f0a80de477b64d3cb2313588b37eda75
      template: 'Estadio APM by Telemetry query'
      name: 'Estadio APM by Telemetry query'
      description: 'Latencia y errores de los molinetes, la boletería y la tienda, con ítems Telemetry query de Zabbix 8.0.'
      groups:
        - name: Templates/Estadio
      items:
        - uuid: ad1265d150d2478384598524c1e59fa3
          name: 'APM accesos: errores por minuto'
          type: TELEMETRY_QUERY
          key: est.apm.accesos.errores
          delay: 30s
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[0].errores'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          timeout: 5s
          time_shift: 15s
          lookback_limit: 1m
          granularity: 1m
          query:
            columns:
              - column: ServiceName
            aggregated_columns:
              - alias: errores
            filter:
              conditions:
                - column: ResourceAttributes
                  attribute_key: service.namespace
                  value: '{$EST.NS}'
                - column: ServiceName
                  value: accesos
                - column: SpanKind
                  value: Server
                - column: SpanName
                  value: 'POST /validar'
                - column: StatusCode
                  value: Error
          tags:
