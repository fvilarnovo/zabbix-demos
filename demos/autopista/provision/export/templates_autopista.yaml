zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: 'c157166d81fc4a85987f87084703fee8'
      name: 'Templates/Autopista'
  templates:
    - uuid: 'af0f44c09f074594a742c6c70ed4e14e'
      template: 'Autopista APM by Telemetry query'
      name: 'Autopista APM by Telemetry query'
      description: 'Latencia y errores de la app de recaudo de peajes, con ítems Telemetry query de Zabbix 8.0 sobre las trazas OpenTelemetry.'
      groups:
        - name: 'Templates/Autopista'
      items:
        - uuid: 'c721e23de9fc4069a9afed2610cbaa09'
          name: 'APM Gateway: p95'
          type: 'TELEMETRY_QUERY'
          key: 'arm.apm.gateway.p95'
          delay: '30s'
          value_type: 'FLOAT'
          units: 's'
          preprocessing:
            - type: 'JSONPATH'
              parameters:
                - '$[0].p95'
              error_handler: 'CUSTOM_VALUE'
              error_handler_params: '0'
            - type: 'MULTIPLIER'
              parameters:
                - '1.0E-9'
          timeout: '5s'
          time_shift: '15s'
          lookback_limit: '1m'
          granularity: '1m'
          query:
            columns:
              - column: 'ServiceName'
            aggregated_columns:
              - function: 'PERCENTILE'
                column: 'Duration'
                parameters:
                  - '95'
                alias: 'p95'
            filter:
              conditions:
                - column: 'ResourceAttributes'
                  attribute_key: 'service.namespace'
                  value: '{$ARM.NS}'
                - column: 'ServiceName'
                  value: 'peaje-gateway'
                - column: 'SpanKind'
                  value: 'Server'
                - column: 'SpanName'
                  value: 'POST /v1/transacciones'
          tags:
            - tag: 'component'
              value: 'apm'
            - tag: 'servicio'
              value: 'peaje-gateway'
          triggers:
            - uuid: '44139a55631649b9b8cf91f854096013'
              expression: 'last(/Autopista APM by Telemetry query/arm.apm.gateway.p95)>{$ARM.GATEWAY.P95.MAX}'
              name: 'APM Gateway: latencia p95 alta ({ITEM.LASTVALUE})'
              priority: 'AVERAGE'
              tags:
                - tag: 'demo'
                  value: 'autopista'
                - tag: 'zona'
                  value: 'central'
                - tag: 'rol'
                  value: 'sintoma'
                - tag: 'nivel'
                  value: 'apm'
                - tag: 'problema'
                  value: 'latencia_apm'
                - tag: 'recurso'
                  value: 'peaje-gateway'
                - tag: 'recaudo'
                  value: 'si'
        - uuid: '9e9617ac8828496abd78487d7215cf6d'
